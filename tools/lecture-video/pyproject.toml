# Narrated lecture videos from the slides (README: "Generated lecture videos").
# The environment lives in the tool cache (lecture-video.ps1 sets UV_PROJECT_ENVIRONMENT).
[project]
name = "lecture-video"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=1.24",
  "pillow>=11.0",
  "pyyaml>=6.0",
  "soundfile>=0.13",
  "playwright>=1.55",
]

[project.optional-dependencies]
# Local engines. The cloud engines (openai, elevenlabs, azure) need no packages.
piper = ["piper-tts>=1.3"]
# its watermarker (resemble-perth) still imports pkg_resources, gone in newer setuptools
chatterbox = ["chatterbox-tts>=0.1.4", "setuptools<81"]

[tool.uv]
package = false
